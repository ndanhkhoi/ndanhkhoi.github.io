name: Build & Deploy to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Deploy force-pushes an orphan gh-pages branch: two overlapping runs would race
# that rewrite. Queue them, and never cancel a deploy half-way through.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      # cv.pdf is what every "Download CV" button opens. A build that produced
      # HTML but no PDF would deploy a page whose main call to action 404s - and
      # one that paginated a section away would deploy a perfectly valid PDF
      # that is missing part of the CV. check-pdf.mjs asserts the file still
      # says everything src/data/resume.js says, so neither can reach gh-pages.
      - name: Verify cv.pdf matches the CV data
        run: |
          test -s _site/cv.pdf
          node scripts/check-pdf.mjs

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
