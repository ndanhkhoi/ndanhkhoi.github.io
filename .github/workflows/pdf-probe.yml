# Temporary: produce cv.pdf on the CI runner in both headless modes and upload
# the text pdf.js extracts from each, so the difference can be looked at instead
# of guessed at. Delete once the question is answered.
name: PDF text probe

on:
  push:
    branches: [ci/pdf-text-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [default, shell]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:html
      - name: Print the PDF
        env:
          PDF_HEADLESS: ${{ matrix.mode }}
        run: npm run build:pdf
      - name: Dump what the PDF says
        run: |
          node scripts/pdf-facts.mjs > pdf-facts.json
          node scripts/check-pdf.mjs || true
          node -e "
            const fs = require('fs');
            const facts = JSON.parse(fs.readFileSync('pdf-facts.json', 'utf8'));
            fs.writeFileSync('pdf-text.txt', facts.text.map((t, i) => '=== page ' + (i + 1) + ' ===\n' + t).join('\n\n'));
          "
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-probe-${{ matrix.mode }}
          path: |
            pdf-text.txt
            _site/cv.pdf
